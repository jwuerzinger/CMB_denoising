name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # pixi.lock is not committed, so every run solves and installs the
    # environment from scratch (no cache); the solve can take a while.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.67.2 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install CPU environment
        run: pixi install -e cpu

      - name: Run tests
        run: pixi run -e cpu test
