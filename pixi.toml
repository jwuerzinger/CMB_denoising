[workspace]
channels = ["conda-forge"]
name = "CMB-denoising"
platforms = ["linux-64"]
version = "0.1.0"

# Shared dependencies used by both the GPU and CPU environments.
[feature.common.dependencies]
python = ">=3.11,<3.14"
pytest = ">=8.4.2,<9"
pip = ">=25.2,<26"
numpy = ">=2.3.2,<3"
scipy = ">=1.15,<2"
matplotlib = ">=3.8,<4"
pyyaml = ">=6.0,<7"
click = ">=8.1,<9"
tqdm = ">=4.66,<5"
ipython = ">=8.0,<9"
typing-extensions = "==4.7.1"
setuptools = ">=70,<71"

[feature.common.tasks]
test = "pytest tests/ -v"

[feature.common.pypi-dependencies]
nifty = ">=9.0.0, <10"
maria = { git = "https://github.com/thomaswmorris/maria.git", rev = "5b5a7bfee28edc7da47300e87ed1b32acba6c5f0" }
minkasi = { git = "https://github.com/sievers/minkasi" }
maria_nifty = { path = ".", editable = true }

# GPU-specific: CUDA 12.6 driver and system requirement.
[feature.gpu.dependencies]
cuda-version = "12.6.*"

[feature.gpu.pypi-dependencies]
jax = { version = ">=0.7.0,<1", extras = ["cuda12"] }

[feature.gpu.system-requirements]
cuda = "12.6"

[feature.cpu.pypi-dependencies]
jax = ">=0.7.0,<1"

[environments]
default = { features = ["common", "gpu"], solve-group = "default" }
cpu = { features = ["common", "cpu"], no-default-feature = true }
